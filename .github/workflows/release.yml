# WiHisar release builds — Android APK + Windows app.
#
# Builds the Flutter app and attaches the installers to the GitHub release
# for the tag. Two triggers:
#   1. Pushing a tag like v0.2.0 (the normal path: every version bump ships
#      a release with fresh builds).
#   2. Manual run (Actions tab -> "Release" -> Run workflow) with a tag
#      input, e.g. to attach builds to an existing release.
#
# Notes (honest):
# - The APK is signed with the stable WiHisar release keystore (kept as
#   repo secrets ANDROID_KEYSTORE_*; backup outside the repo). From
#   v0.4.1 on, every release APK carries the same signature, so updates
#   install over the old app — including the in-app updater. Builds
#   before v0.4.1 used Flutter's per-run debug key, so moving to v0.4.1
#   needs ONE uninstall of the old app; after that, no more uninstalls.
# - iOS (.ipa) is NOT built here: it needs macOS + Xcode + Apple signing,
#   which GitHub's macOS runner could do only with the user's Apple
#   credentials. Android + Windows first; iOS later.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach builds to (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Set tag name
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV
      - name: Analyze (info-level notices never block a release)
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Set up release signing (stable key, one uninstall to v0.4.1)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/wihisar-release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=wihisar-release.keystore\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Build APK
        run: flutter build apk --release
      - name: Verify release signature (must be the WiHisar key, not debug)
        run: |
          keytool -printcert -jarfile "build/app/outputs/flutter-apk/app-release.apk" | tee /tmp/cert.txt
          grep -q "CN=WiHisar" /tmp/cert.txt
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            WiHisar-$TAG-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: WiHisar-*-Android.apk

  build-windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Set tag name
        shell: pwsh
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> $env:GITHUB_ENV
      - name: Analyze (info-level notices never block a release)
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Windows
        run: flutter build windows --release
      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "WiHisar-$env:TAG-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: WiHisar-*-Windows.zip

  attach-to-release:
    name: Attach to release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
