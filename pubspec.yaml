name: wihisar
description: "WiHisar — own-WiFi security tester and bandwidth limiter (educational, own router only). Lightweight Flutter app for Android, iOS and Windows."
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  network_info_plus: ^8.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
