name: wihisar
description: "WiHisar — own-WiFi security tester and bandwidth limiter (educational, own router only). Lightweight Flutter app for Android, iOS and Windows."
publish_to: "none"
version: 0.5.0+6

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  archive: ^4.7.1
  crypto: ^3.0.8
  dartssh2: ^4.1.0
  flutter:
    sdk: flutter
  network_info_plus: ^8.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
